<!DOCTYPE html>
<html>
<head>
  <title>Edit Student</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
  <h2>Edit Student Details</h2>
  <form method="POST">
    <div class="mb-3">
      <label>Name</label>
      <input type="text" name="name" value="{{ student.name }}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Roll Number</label>
      <input type="text" name="roll_number" value="{{ student.roll_number }}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Department</label>
      <input type="text" name="department" value="{{ student.department }}" class="form-control">
    </div>
    <div class="mb-3">
      <label>Branch</label>
      <input type="text" name="branch" value="{{ student.branch }}" class="form-control">
    </div>
    <div class="mb-3">
      <label>Section</label>
      <input type="text" name="section" value="{{ student.section }}" class="form-control">
    </div>
    <div class="mb-3">
      <label>Year</label>
      <select name="year" class="form-select">
        <option value="" {% if not student.year %}selected{% endif %}>Select Year</option>
        <option value="1" {% if student.year == '1' %}selected{% endif %}>1st Year</option>
        <option value="2" {% if student.year == '2' %}selected{% endif %}>2nd Year</option>
        <option value="3" {% if student.year == '3' %}selected{% endif %}>3rd Year</option>
        <option value="4" {% if student.year == '4' %}selected{% endif %}>4th Year</option>
        <option value="Graduated" {% if student.year == 'Graduated' %}selected{% endif %}>Graduated</option>
      </select>
    </div>
    <button class="btn btn-success">Update</button>
    <a href="{{ url_for('manager_dashboard') }}" class="btn btn-secondary">Cancel</a>
  </form>
</body>
</html>
