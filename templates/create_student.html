{% extends "base.html" %}
{% block title %}Create Student{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<div class="card p-4 mx-auto mt-4" style="max-width: 600px; font-family: 'Outfit', sans-serif;">
  <h2 class="mb-4 text-center">🎓 Create Student Account</h2>

  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-bold">Name <span class="text-danger">*</span></label>
      <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Roll Number <span class="text-danger">*</span></label>
      <input type="text" name="roll_number" class="form-control" placeholder="e.g. 22FA04001" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Email Address</label>
      <input type="email" name="email" class="form-control" placeholder="Defaults to [roll]@student.vignan.ac.in">
      <div class="form-text text-muted">Leave blank to auto-generate based on roll number.</div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Department</label>
        <input type="text" name="department" class="form-control" list="dept-list" placeholder="e.g. DCMS or CSE">
        <datalist id="dept-list">
          <option value="DCMS">
          <option value="CSE">
          <option value="BIOTECH">
          <option value="ECE">
          <option value="ACSE">
          <option value="IT">
          <option value="MECH">
          <option value="CIVIL">
        </datalist>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Branch</label>
        <input type="text" name="branch" class="form-control" list="branch-list" placeholder="e.g. BCA, BBA, MCA, MBA">
        <datalist id="branch-list">
          <option value="BCA">
          <option value="BBA">
          <option value="MCA">
          <option value="MBA">
          <option value="CSE">
          <option value="ECE">
          <option value="AIML">
          <option value="CS">
          <option value="DS">
          <option value="MECH">
          <option value="CIVIL">
        </datalist>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Section</label>
        <input type="text" name="section" class="form-control" placeholder="e.g. A">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Year</label>
        <select name="year" class="form-select">
          <option value="">Auto-calculate from Roll No</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
          <option value="Graduated">Graduated</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Defaults to password123">
      <div class="form-text text-muted">Leave blank to default to <code>password123</code>.</div>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <button type="submit" class="btn btn-success px-4">Create Student</button>
      <a href="{{ url_for('manager_dashboard') }}" class="btn btn-secondary px-4">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
