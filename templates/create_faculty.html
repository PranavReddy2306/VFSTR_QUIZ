{% extends "base.html" %}
{% block title %}Create Faculty{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<div class="card p-4 mx-auto mt-4" style="max-width: 600px;">
  <h2 class="mb-4 text-center">👩‍🏫 Create Faculty Account</h2>

  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-bold">Name</label>
      <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Email</label>
      <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Department</label>
        <input type="text" name="department" class="form-control" list="dept-list-fac" placeholder="e.g. DCMS or CSE">
        <datalist id="dept-list-fac">
          <option value="DCMS">
          <option value="CSE">
          <option value="BIOTECH">
          <option value="ECE">
          <option value="ACSE">
          <option value="IT">
          <option value="MECH">
          <option value="CIVIL">
        </datalist>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Branch</label>
        <input type="text" name="branch" class="form-control" list="branch-list-fac" placeholder="e.g. BCA, BBA, MCA, MBA">
        <datalist id="branch-list-fac">
          <option value="BCA">
          <option value="BBA">
          <option value="MCA">
          <option value="MBA">
          <option value="CSE">
          <option value="ECE">
          <option value="AIML">
          <option value="CS">
          <option value="DS">
          <option value="MECH">
          <option value="CIVIL">
        </datalist>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Section</label>
        <input type="text" name="section" class="form-control" placeholder="e.g. A">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Year</label>
        <select name="year" class="form-select">
          <option value="">All/Select Year</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter secure password" required>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <button type="submit" class="btn btn-success px-4">Create Faculty</button>
      <a href="{{ url_for('manager_dashboard') }}" class="btn btn-secondary px-4">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
