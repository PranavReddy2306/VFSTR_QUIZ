<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - VFSTR CRT Quiz Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      --bg-slate: #0f172a;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-slate);
      background-image:
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
      padding: 40px 35px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-logo {
      height: 70px;
      width: auto;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.1));
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.6rem;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 0.9rem;
      color: #64748b;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.88rem;
      color: #334155;
      margin-bottom: 8px;
    }

    .input-group-text {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #64748b;
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }

    .form-control {
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #0f172a;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    .btn-login {
      background: var(--primary-gradient);
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      padding: 13px;
      border-radius: 12px;
      border: none;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
      transition: all 0.25s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(79, 70, 229, 0.45);
      color: #ffffff;
    }

    .footer-text {
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="brand-header">
      <img src="{{ url_for('static', filename='vignan.png') }}" alt="VFSTR Logo" class="brand-logo">
      <div class="brand-title">VFSTR HYD <span style="color: #4f46e5;">QUIZ</span></div>
      <div class="brand-subtitle">Sign in to access your assessment dashboard</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category if category != 'danger' else 'danger' }} py-2 px-3 small rounded-3 mb-3">
      {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Email or Roll Number</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
          <input type="text" name="identifier" class="form-control" placeholder="e.g. 22FA04001 or email" required
            style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required
            style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
        </div>
      </div>

      <button type="submit" class="btn btn-login">
        Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
      </button>
    </form>

    <div class="position-relative my-4 text-center">
      <hr class="text-secondary opacity-25 my-0">
      <span
        class="position-absolute top-50 start-50 translate-middle px-3 bg-white text-muted small fw-semibold">OR</span>
    </div>

    <button type="button" id="firebaseGoogleBtn"
      class="btn btn-outline-secondary w-100 py-2.5 rounded-3 fw-semibold d-flex align-items-center justify-content-center gap-2">
      <i class="fa-brands fa-google text-danger fs-5"></i> Sign in with Google (Firebase)
    </button>

    <div class="footer-text">
      © 2026 Vignan's Foundation for Science, Technology & Research
    </div>
  </div>

  <!-- Firebase Web JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script>
    // Paste your Firebase Web App configuration snippet here
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    if (window.firebase && firebaseConfig.apiKey !== "YOUR_API_KEY") {
      firebase.initializeApp(firebaseConfig);
    }

    document.getElementById('firebaseGoogleBtn').addEventListener('click', function () {
      if (!window.firebase || firebaseConfig.apiKey === "YOUR_API_KEY") {
        alert("ℹ️ Firebase configuration key is required. Please update firebaseConfig in templates/login.html with your Firebase project details from Firebase Console.");
        return;
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then((result) => {
          return result.user.getIdToken();
        })
        .then((idToken) => {
          return fetch('/auth/firebase-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_token: idToken })
          });
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            window.location.href = data.redirect_url;
          } else {
            alert("❌ Firebase Login Failed: " + data.message);
          }
        })
        .catch((error) => {
          console.error("Firebase auth error:", error);
          alert("❌ Google Sign-In Error: " + error.message);
        });
    });
  </script>

</body>

</html>
